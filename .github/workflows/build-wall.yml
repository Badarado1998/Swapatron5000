name: Build contributors wall

on:
  push:
    branches: [main]
    paths:
      - contributions.csv
      - scripts/build_wall.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 scripts/build_wall.py
      - name: Commit the wall if it changed
        run: |
          if [ -n "$(git status --porcelain CONTRIBUTORS.md README.md index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CONTRIBUTORS.md README.md index.html
            git commit -m "Update contributors wall"
            git push
          fi
