name: Count me in
description: Say you are interested in the first meetup. You can start contributing now too. Nothing is decided yet.
title: "Count me in: "
labels: ["gathering"]
body:
  - type: markdown
    attributes:
      value: |
        You can start contributing right now, with no gates. This form is just for people who want to hear about the first meetup. It is proposed for a Wednesday evening, January 13, 2027, online on the Mutiny19 Discord. The time is not set, and nothing is confirmed. This form just says "I would like to hear when it is." Everything here is public, so please do not post your address, phone number, or email.
  - type: checkboxes
    id: who
    attributes:
      label: Which of these sounds like you?
      options:
        - label: New to electronics and curious
        - label: I build IoT or electronics projects
        - label: I have a drawer of spare parts
        - label: I teach, coach, or lead a youth group
        - label: I run a local business, club, or food truck
        - label: I would like to help run things (see the founding team page)
  - type: dropdown
    id: github
    attributes:
      label: How new are you to GitHub?
      options:
        - "Never used it"
        - "I have an account, but I am not sure how it works"
        - "I use it often"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How would you like to join the first meetup?
      options:
        - "Online, on Discord"
        - "Online, but not on Discord"
        - "In person, in Fishers, if there is a way"
        - "I do not know yet"
    validations:
      required: true
  - type: dropdown
    id: kids
    attributes:
      label: Would kids (understudies) be joining with you?
      description: No names or ages, please. This helps us plan.
      options:
        - "No"
        - "Yes"
        - "Maybe"
  - type: textarea
    id: why
    attributes:
      label: Anything you would like Swapatron to know? (optional)
