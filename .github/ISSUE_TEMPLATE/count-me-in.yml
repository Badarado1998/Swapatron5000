name: Count me in
description: We are gathering people for the first meetup. Say you are interested. Nothing is decided yet.
title: "Count me in: "
labels: ["gathering"]
body:
  - type: markdown
    attributes:
      value: |
        Right now we are gathering people. The first meetup is proposed for a Wednesday evening, January 13, 2027, online or in person. The format, the time, and the place are not set. This form just says "I would like to hear when it is." Everything here is public, so please do not post your address, phone number, or email.
  - type: checkboxes
    id: who
    attributes:
      label: Which of these sounds like you?
      options:
        - label: New to electronics and curious
        - label: I build IoT or electronics projects
        - label: I have a drawer of spare parts
        - label: I teach, coach, or lead a youth group
        - label: I run a local business, club, or food truck
        - label: I would like to help run things (see the founding team page)
  - type: dropdown
    id: github
    attributes:
      label: How new are you to GitHub?
      options:
        - "Never used it"
        - "I have an account, but I am not sure how it works"
        - "I use it often"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How would you like to join the first meetup?
      options:
        - "Online"
        - "In person, in Fishers"
        - "Either"
        - "I do not know yet"
    validations:
      required: true
  - type: dropdown
    id: kids
    attributes:
      label: Would kids (understudies) be joining with you?
      description: No names or ages, please. This helps us plan.
      options:
        - "No"
        - "Yes"
        - "Maybe"
  - type: textarea
    id: why
    attributes:
      label: Anything you would like Swapatron to know? (optional)
