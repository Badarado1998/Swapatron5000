name: Pledge a part
description: Offer a part or supply from the Bill of Materials
title: "Pledge: "
labels: ["supplies"]
body:
  - type: markdown
    attributes:
      value: Thank you! Check the Bill of Materials (bom/BOM.csv) to see what is still needed.
  - type: input
    id: item
    attributes:
      label: What are you pledging?
      placeholder: Anti-static bags, assorted sizes
    validations:
      required: true
  - type: input
    id: quantity
    attributes:
      label: How many?
      placeholder: "50"
    validations:
      required: true
  - type: dropdown
    id: condition
    attributes:
      label: Condition
      options:
        - New
        - Used, tested working
        - Used, untested
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know?
      description: Specs, sizes, or when you can drop it off. Please do not post your phone number or address.
